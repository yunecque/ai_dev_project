name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install control plane
        run: pip install -e "control-plane[dev]"
      - name: Validate baseline
        run: sdlc validate baseline.json
      - name: Validate workflow artifacts
        run: |
          mapfile -t files < <(find specs -name '*.json' -not -path '*/generated/*')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::no artifacts found under specs/"
            exit 0
          fi
          sdlc validate "${files[@]}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lint
        run: |
          pip install -e "control-plane[dev]"
          ruff check control-plane/src control-plane/tests
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
      - name: Go lint
        run: |
          if [ -f apps/go.mod ]; then
            gofmt -l apps | tee /tmp/gofmt.out
            test ! -s /tmp/gofmt.out
          else
            echo "::warning::no Go modules yet (M1)"
          fi

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python typecheck
        run: |
          pip install -e "control-plane[dev]"
          cd control-plane
          mypy
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
      - name: Go vet
        run: |
          if [ -f apps/go.mod ]; then
            (cd apps && go vet ./...)
          else
            echo "::warning::no Go modules yet (M1)"
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Control plane tests
        run: |
          pip install -e "control-plane[dev]"
          pytest control-plane -q
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
      - name: Go unit tests
        run: |
          if [ -f apps/go.mod ]; then
            (cd apps && go test ./...)
          else
            echo "::warning::no Go modules yet (M1)"
          fi

  # --- Stages implemented in M1 / M3. Placeholders keep required-check names present. ---

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.73.0"
      - name: Protobuf lint
        run: buf lint contracts/proto
      - name: Control-plane contract tests
        run: |
          pip install -e "control-plane[dev]"
          pytest control-plane/tests/test_contracts.py -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: pip install "semgrep>=1.177,<2"
      - name: Semgrep (local rules)
        run: semgrep scan --config security/semgrep/rules.yaml --error --metrics=off apps control-plane

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::dependency-scan (Trivy) implemented in M3"

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sdlc
          POSTGRES_PASSWORD: sdlc-dev-password
          POSTGRES_DB: requests
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sdlc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/go.mod
      - name: Go integration tests
        env:
          TEST_DATABASE_URL: postgres://sdlc:sdlc-dev-password@localhost:5432/requests
        run: (cd apps && go test -tags=integration ./...)

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Control-plane security tests
        run: |
          pip install -e "control-plane[dev]"
          pytest control-plane/tests/test_policy.py control-plane/tests/test_runner.py \
            control-plane/tests/test_evidence.py control-plane/tests/test_trust.py -q
      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
      - name: Trivy secret scan
        run: trivy fs --scanners secret --exit-code 1 --severity HIGH,CRITICAL --skip-dirs .git .

  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.20.2
      - name: Rego format check
        run: opa fmt --fail policies/
      - name: Rego policy tests
        run: opa test policies/ -v

  build-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::build-image implemented in M1/M3"

  container-scan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::container-scan (Trivy) implemented in M3"

  sbom-generate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::sbom-generate (Syft) implemented in M3"

  sign-and-attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-image, sbom-generate]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - run: echo "::warning::sign-and-attest (Cosign keyless + attestations) implemented in M3"
