# OpenTelemetry Collector for local development.
# Mandatory redaction of secrets/tokens/PII before export (constitution section 6, ADR-0010).
# The redaction transform MUST stay wired into every signal pipeline; the guard test
# control-plane/tests/test_redaction.py fails if a pipeline or a required pattern is removed.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.request.header.authorization"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.cookie"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.response.header.set-cookie"], ".*", "[REDACTED]")
    metric_statements:
      - context: datapoint
        statements:
          - replace_pattern(attributes["http.request.header.authorization"], ".*", "[REDACTED]")
          - replace_pattern(attributes["http.request.header.cookie"], ".*", "[REDACTED]")
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(?i)(authorization|password|passwd|secret|token|api[_-]?key)\s*[:=]\s*\S+", "$1=[REDACTED]")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[REDACTED_EMAIL]")

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [loki]
