# Staging stack for the Secure Agentic SDLC platform (M4, TASK-0005; ADR-0005/0010).
# Run from this directory with an env file that is NOT committed:
#   docker compose --env-file .env up -d
# App images are pulled from GHCR (signed + attested on main); configs are reused from
# infra/compose. Never put real secrets in this file — use the env file.

name: secure-agentic-sdlc-staging

x-app-env: &app-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

x-restart: &restart unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-requests}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: *restart
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: *restart
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ../compose/keycloak:/opt/keycloak/data/import:ro

  opa:
    image: openpolicyagent/opa:1.20.2
    restart: *restart
    command: ["run", "--server", "--log-level=info", "/policies"]
    volumes:
      - ../../policies:/policies:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: *restart
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../compose/otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../compose/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:?set GRAFANA_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.1.1
    restart: *restart
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../compose/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.6.0
    restart: *restart
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../compose/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ../../apps/domain/migrations:/migrations/domain:ro
      - ../../apps/worker/migrations:/migrations/worker:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB:-requests} -v ON_ERROR_STOP=1
        -f /migrations/domain/0001_init.sql
        -f /migrations/worker/0002_processed_events.sql

  domain:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/domain:${IMAGE_TAG:?set IMAGE_TAG}
    restart: *restart
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DOMAIN_LISTEN: ":9090"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  publisher:
    image: ${IMAGE_REGISTRY}/publisher:${IMAGE_TAG}
    restart: *restart
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${IMAGE_REGISTRY}/worker:${IMAGE_TAG}
    restart: *restart
    environment:
      <<: *app-env
      DATABASE_URL: ${DATABASE_URL}
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  gateway:
    image: ${IMAGE_REGISTRY}/gateway:${IMAGE_TAG}
    restart: *restart
    environment:
      <<: *app-env
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      DOMAIN_ADDR: domain:9090
      GATEWAY_LISTEN: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      domain:
        condition: service_started

volumes:
  postgres-data:
  nats-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
