syntax = "proto3";

package domain.v1;

option go_package = "github.com/yunecque/ai_dev_project/apps/domain/gen/domain/v1;domainv1";

// Internal service contract for the request-creation golden path.
service DomainService {
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
}

message CreateRequestRequest {
  string title = 1;
  string description = 2;
  // Verified identity context forwarded by the gateway (subject from OIDC token).
  string subject = 3;
}

message CreateRequestResponse {
  Request request = 1;
}

message Request {
  string id = 1;
  string title = 2;
  string status = 3;
  string created_at = 4;
}

// Domain event persisted to the transactional outbox and published to NATS.
message RequestCreated {
  string event_id = 1;
  string event_type = 2;
  string occurred_at = 3;
  Request request = 4;
}