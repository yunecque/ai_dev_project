syntax = "proto3";

package domain.v1;

option go_package = "github.com/yunecque/ai_dev_project/apps/domain/gen/domain/v1;domainv1";

// Internal service contract for the request golden path.
service DomainService {
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // Applies a lifecycle transition to an existing request and emits RequestStatusChanged.
  rpc UpdateRequestStatus(UpdateRequestStatusRequest) returns (UpdateRequestStatusResponse);
  // Reads a single request by id (operator workflow).
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse);
  // Lists requests with optional status/subject filters (operator workflow).
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
}

message CreateRequestRequest {
  string title = 1;
  string description = 2;
  // Verified identity context forwarded by the gateway (subject from OIDC token).
  string subject = 3;
}

message CreateRequestResponse {
  Request request = 1;
}

message UpdateRequestStatusRequest {
  string request_id = 1;
  // Target lifecycle status; the domain enforces allowed transitions.
  string new_status = 2;
  // Verified identity context forwarded by the gateway (subject from OIDC token).
  string actor_subject = 3;
}

message UpdateRequestStatusResponse {
  Request request = 1;
}

message GetRequestRequest {
  string request_id = 1;
}

message GetRequestResponse {
  Request request = 1;
}

message ListRequestsRequest {
  // Optional lifecycle status filter; empty means no filter.
  string status = 1;
  // Optional owning subject filter; empty means no filter.
  string subject = 2;
  // Optional maximum number of results; the server applies a default and a cap.
  int32 limit = 3;
}

message ListRequestsResponse {
  repeated Request requests = 1;
}

message Request {
  string id = 1;
  string title = 2;
  string status = 3;
  string created_at = 4;
}

// Domain event persisted to the transactional outbox and published to NATS.
message RequestCreated {
  string event_id = 1;
  string event_type = 2;
  string occurred_at = 3;
  Request request = 4;
}

// Domain event emitted when a request changes lifecycle status.
message RequestStatusChanged {
  string event_id = 1;
  string event_type = 2;
  string occurred_at = 3;
  StatusChange request = 4;
}

message StatusChange {
  string id = 1;
  string status = 2;
  string previous_status = 3;
  string updated_at = 4;
}