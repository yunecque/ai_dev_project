version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/yunecque/ai_dev_project/apps/gen
plugins:
  - local: protoc-gen-go
    out: ../../apps/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../../apps/gen
    opt: paths=source_relative